name: ATMS PRO Native APK + Patch Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'ATMS_PRO_CORE-*.zip'
      - '.github/workflows/android-native-apk.yml'

permissions:
  contents: write

jobs:
  validate-install-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find one uploaded ATMS patch ZIP
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PATCHES < <(find . -maxdepth 1 -type f -name 'ATMS_PRO_CORE-*.zip' -printf '%f\n' | sort)
          if (( ${#PATCHES[@]} > 1 )); then
            echo "ERROR: More than one ATMS patch ZIP is present in repository root." >&2
            printf '%s\n' "${PATCHES[@]}" >&2
            exit 1
          fi
          if (( ${#PATCHES[@]} == 1 )); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=${PATCHES[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and stage patch safely
        if: steps.patch.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PATCH="${{ steps.patch.outputs.file }}"
          TMP="$(mktemp -d)"

          # Reject absolute paths, traversal, and anything outside the approved package layout.
          unzip -Z1 "$PATCH" > "$TMP/list.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' "$TMP/list.txt"; then
            echo "ERROR: Unsafe path in patch ZIP." >&2
            exit 1
          fi
          if grep -Ev '^(android-native/|README_[^/]+\.txt$|SHA256\.txt$|[^/]+/$)' "$TMP/list.txt" | grep -q .; then
            echo "ERROR: Patch contains files outside android-native/, README_*.txt, or SHA256.txt." >&2
            grep -Ev '^(android-native/|README_[^/]+\.txt$|SHA256\.txt$|[^/]+/$)' "$TMP/list.txt" >&2 || true
            exit 1
          fi

          unzip -q "$PATCH" -d "$TMP/payload"
          test -f "$TMP/payload/SHA256.txt" || { echo 'ERROR: SHA256.txt missing.' >&2; exit 1; }
          test -d "$TMP/payload/android-native" || { echo 'ERROR: android-native/ missing.' >&2; exit 1; }

          (cd "$TMP/payload" && sha256sum -c SHA256.txt)

          # Overlay only after every validation above has passed.
          cp -a "$TMP/payload/android-native/." android-native/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK before accepting patch
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMSPro-Native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated patch and remove upload ZIP
        if: steps.patch.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PATCH="${{ steps.patch.outputs.file }}"
          rm -f "$PATCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A android-native "$PATCH"
          if git diff --cached --quiet; then
            echo 'ERROR: Valid patch produced no repository change.' >&2
            exit 1
          fi
          git commit -m 'CORE-007D8A1F1D8P31F13 Native Stable Web UI Integration' \
            -m 'Validated and installed automatically by the ATMS PRO one-upload patch workflow after SHA256 verification and a successful Native APK build.'
          git push
