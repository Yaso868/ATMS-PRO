name: ATMS PRO Native APK + P31F13 One-Upload Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-apk.yml'

permissions:
  contents: write

jobs:
  apply-build-p31f13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize embedded P31F13 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .atms-patch
          printf '%s' '' | base64 -d > .atms-patch/p31f13.zip
          echo "6136516f91ef43a00c2260d19ddfa0295146371b860f5ce6957455f81ec45160  .atms-patch/p31f13.zip" | sha256sum -c -

      - name: Validate and apply P31F13 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .atms-patch/unpacked
          unzip -q .atms-patch/p31f13.zip -d .atms-patch/unpacked
          cd .atms-patch/unpacked
          test -f SHA256.txt
          sha256sum -c SHA256.txt
          while IFS= read -r f; do
            case "$f" in
              android-native/app/*|README_P31F13.txt|SHA256.txt) ;;
              *) echo "Unexpected patch path: $f"; exit 1 ;;
            esac
          done < <(find . -type f -printf '%P\n')
          cd ../..
          cp -a .atms-patch/unpacked/android-native/app/. android-native/app/
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build patched debug APK before commit
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified P31F13 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/app
          if git diff --cached --quiet; then
            echo "P31F13 source already applied; no source commit needed."
          else
            git commit -m "CORE-007D8A1F1D8P31F13 Native Stable Web UI Integration" -m "Apply verified embedded P31F13 source after SHA256 validation and successful APK build."
            git push
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMSPro-Native-P31F13-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
