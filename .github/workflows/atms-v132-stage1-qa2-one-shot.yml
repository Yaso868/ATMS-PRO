      - name: Verify frozen branch, one-file commit, apply SHA-pinned patch and run private-data-free synthetic QA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/atms-v132-stage-runner.py" <<'ATMS_STAGE_RUNNER_PY'
          #!/usr/bin/env python3
          """V1.32 QA2 read-only isolated reconstruction; CI only with a one-file GitHub push.
          This file is EMBEDDED in the eventual single workflow, never uploaded separately.
          """
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import zipfile
          
          BASE_SHA='948a2f0fcb9e6cdcadbb8a54b709f98f4d5df547'
          WORKFLOW='.github/workflows/atms-v132-stage1-qa2-one-shot.yml'
          # Populated by the local generator; not computed from any GitHub secrets.
          PAYLOAD_SHA='9a77b20c16d21a6f6165bd1975ec66016e1f678121f702dc47d4baa22c776e96'
          BASE_HASHES={'android-native/app/src/main/assets/js/plan-import.js': '5f0bb740a4732b4208f371dc2d897646ab43eb9cfaf9c997486936ca46b3fac9', 'android-native/app/src/main/assets/index.html': '025adb0da8117907129819f52d8b2656ca5a6ccd40348699495747a56978e621', 'android-native/app/src/main/assets/js/atms-v132-source-preview.js': 'ABSENT', 'android-native/tools/v132-qa2-synthetic-selftest.cjs': 'ABSENT'}
          TARGET_HASHES={'android-native/app/src/main/assets/js/plan-import.js': 'be7c2461212af4418c1dc64a356c35689464a716b8cdb5689151cda51b22c74a', 'android-native/app/src/main/assets/index.html': '9982d8b49b5a683fedf6dab13e175b24a560329ca13d9214713dbe20d0c69b3d', 'android-native/app/src/main/assets/js/atms-v132-source-preview.js': '881ebee61ef5732544b43abde4b33b25a943cd5bc609a47f2d223789e1dabe20', 'android-native/tools/v132-qa2-synthetic-selftest.cjs': '36a5898d9a3f79e2d07b4dbc30593785a13882b020d5a43e8ff9f8820d696f0a'}
          PATCH_SHA="9ff3768288cb923e55916f9c4bb3226d5594ccbe666b034f6e071ca946964a6f"
          PATCHED=["android-native/app/src/main/assets/js/plan-import.js","android-native/app/src/main/assets/index.html"]
          ADDED=["android-native/app/src/main/assets/js/atms-v132-source-preview.js","android-native/tools/v132-qa2-synthetic-selftest.cjs"]
          ALLOWED=set(ADDED+["overlay.patch"])
          
          
          def fail(message):
              raise SystemExit('FAIL-CLOSED ATMS V132 QA2: '+message)
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def run(*args,cwd=None):
              q=subprocess.run(args,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
              if q.returncode: fail('git command failed: '+str(args)+' '+q.stderr[-500:])
              return q.stdout.strip()
          
          
          def verify_git_checkout(repo):
              if os.environ.get('GITHUB_ACTIONS')!='true': fail('Only CI runner can use live mode')
              if os.environ.get('GITHUB_EVENT_NAME')!='push': fail('Unexpected event')
              if os.environ.get('GITHUB_REF')!='refs/heads/atms-price-p11429-test-only': fail('Wrong branch')
              if os.environ.get('GITHUB_REPOSITORY')!='Yaso868/ATMS-PRO': fail('Wrong repository')
              if os.environ.get('GITHUB_RUN_ATTEMPT')!='1': fail('Not the first workflow attempt')
              evt=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              if evt.get('before')!=BASE_SHA: fail('Unexpected before commit')
              head=run('git','rev-parse','HEAD',cwd=repo)
              if head!=evt.get('after') or head!=os.environ.get('GITHUB_SHA'): fail('Wrong event head')
              if run('git','rev-parse','HEAD^',cwd=repo)!=BASE_SHA: fail('Source parent SHA drift')
              changed=run('git','diff-tree','--no-commit-id','--name-only','-r','HEAD',cwd=repo).splitlines()
              if changed!=[WORKFLOW]: fail('Exactly one safe workflow file must be added; changed='+str(changed))
              if run('git','status','--porcelain','--untracked-files=all',cwd=repo):fail('CI checkout not clean')
              present=subprocess.run(['git','cat-file','-e','HEAD^:'+WORKFLOW],cwd=repo,capture_output=True)
              if present.returncode==0:fail('Workflow must be newly added exactly once')
              # Ensure no Android source changed in the commit itself; all overlay changes are ephemeral.
              if run('git','diff','--name-only',BASE_SHA,'HEAD','--','android-native',cwd=repo):fail('Dangerous Android source mutation in GitHub')
          
          
          def stage():
              repo=Path(os.environ['ATMS_QA2_REPO']).resolve()
              work=Path(os.environ['ATMS_QA2_WORK']).resolve()
              local=os.environ.get('ATMS_QA2_VERIFY_LOCAL')=='1'
              if not local:verify_git_checkout(repo)
              if not (repo/'android-native/app/build.gradle').is_file():fail('Baseline Android source missing')
              raw_b64=Path(os.environ['ATMS_QA2_PAYLOAD_B64_FILE']).read_text('ascii'); raw_b64=''.join(raw_b64.split())
              try: archive=base64.b64decode(raw_b64,validate=True)
              except Exception as e:fail('Invalid embedded archive base64: '+str(e))
              if sha(archive)!=PAYLOAD_SHA:fail('Tampered embedded patch archive')
              if work.exists():fail('Refusing existing work directory')
              work.mkdir(parents=True)
              try:
                  with zipfile.ZipFile(io.BytesIO(archive)) as z:
                      names=z.namelist()
                      if len(names)!=3 or set(names)!=ALLOWED or len(names)!=len(set(names)):
                          fail('Overlay contains additional, missing or duplicated paths')
                      files={}
                      for info in z.infolist():
                          if info.is_dir() or info.file_size>500_000 or info.file_size<=0:
                              fail('Non-file/oversized overlay member')
                          if ((info.external_attr>>16)&0o170000) not in (0,stat.S_IFREG):
                              fail('Overlay member is not a regular file')
                          path=Path(info.filename)
                          if path.is_absolute() or '..' in path.parts or '\\' in info.filename:
                              fail('Overlay path traversal')
                          data=z.read(info)
                          expected=PATCH_SHA if info.filename=='overlay.patch' else TARGET_HASHES[info.filename]
                          if sha(data)!=expected: fail('Overlay member digest mismatch '+info.filename)
                          files[info.filename]=data
                  patch=files.pop('overlay.patch')
                  headers=re.findall(rb'^--- a/([^\n]+)\n\+\+\+ b/([^\n]+)\n',patch,re.M)
                  if len(headers)!=2 or [a.decode() for a,b in headers]!=PATCHED or any(a!=b for a,b in headers):
                      fail('Diff modifies unapproved paths')
                  baseline=repo/'android-native'
                  for rel,expected in BASE_HASHES.items():
                      p=repo/rel
                      if expected=='ABSENT':
                          if p.exists() or p.is_symlink():fail('New file unexpectedly exists '+rel)
                      elif not p.is_file() or p.is_symlink() or sha(p.read_bytes())!=expected:
                          fail('Original source digest mismatch '+rel)
                  shutil.copytree(baseline,work/'android-native',symlinks=True)
                  for rel,data in files.items():
                      if rel not in ADDED:fail('Unexpected added file')
                      p=work/rel
                      if not str(p.resolve()).startswith(str((work/'android-native').resolve())+'/'):
                          fail('Outside Android staging')
                      p.parent.mkdir(parents=True,exist_ok=True)
                      if p.exists() or p.is_symlink():fail('Added file unexpectedly exists')
                      p.write_bytes(data)
                  for args in (['git','apply','--check','--whitespace=error'],['git','apply','--whitespace=error']):
                      proc=subprocess.run(args,input=patch,cwd=work,capture_output=True,timeout=30)
                      if proc.returncode:fail('Diff apply failed: '+proc.stderr.decode(errors='replace')[-300:])
                  for rel,expected in TARGET_HASHES.items():
                      p=work/rel
                      if not p.is_file() or p.is_symlink() or sha(p.read_bytes())!=expected:
                          fail('Patched source hash differs '+rel)
                  g=(work/'android-native/app/build.gradle').read_text()
                  main=(work/'android-native/app/src/main/AndroidManifest.xml').read_text()
                  debug=(work/'android-native/app/src/debug/AndroidManifest.xml').read_text()
                  assert_=(
                      g.count("applicationIdSuffix '.qa2'")==2 and
                      "applicationId 'de.atmspro.app'" in g and
                      'signingConfig signingConfigs.atmsStable' in g and
                      'refusing ephemeral debug certificate' in g and
                      'finalizedBy tasks.named(\'verifyQa2SignedApkP11438\')' in g and
                      'android:label="ATMS PRO TEST 2"' in main and
                      'android:label="ATMS PRO TEST 2"' in debug
                  )
                  if not assert_:fail('QA2 package, label or stable signing guard drift')
                  # Do NOT stage original photos or the private 30-ride reference fixture.
                  if any(Path(p).name.startswith(('98853','98854')) for p in files): fail('Private photo in payload')
                  if any('reference_rows' in p for p in files): fail('Private reference data in payload')
                  report={'status':'LOCAL_STAGING_VERIFIED_NOT_BUILT','source_commit':BASE_SHA,
                          'payload_sha256':PAYLOAD_SHA,'target_hashes':TARGET_HASHES,
                          'qa2_package':'de.atmspro.app.qa2','staged_file_count':len(TARGET_HASHES),
                          'no_ride_data_or_photos_uploaded':True,'github_writes':False,'apk_built':False}
                  report_path=work/'ATMS_V132_QA2_LOCAL_STAGING_EVIDENCE.json'
                  report_path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
                  print('ATMS_V132_QA2_LOCAL_STAGING_PASS',len(TARGET_HASHES),PAYLOAD_SHA,flush=True)
              except BaseException:
                  shutil.rmtree(work,ignore_errors=True)
                  raise
          
          
          if __name__=='__main__':
              stage()
          
          ATMS_STAGE_RUNNER_PY
          export ATMS_QA2_REPO="$GITHUB_WORKSPACE"
          export ATMS_QA2_WORK="$RUNNER_TEMP/atms-v132-qa2-isolated"
          export ATMS_QA2_PAYLOAD_B64_FILE="$RUNNER_TEMP/atms-v132-qa2-overlay.b64"
          python3 "$RUNNER_TEMP/atms-v132-stage-runner.py"
          node "$ATMS_QA2_WORK/android-native/tools/v132-qa2-synthetic-selftest.cjs"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify SDK 35 and existing source-protected APK graph (dry-run only)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -f "$SDK/platforms/android-35/android.jar" || { echo 'FAIL-CLOSED SDK 35 missing'; exit 5; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/atms-v132-qa2-isolated/android-native"
          # Pass dummy-but-present signer values only for a NO-BUILD task graph check;
          # Gradle never reads/signs a keystore during --dry-run.
          export ATMS_SIGNING_STORE_FILE="$RUNNER_TEMP/nonexistent-dry-run-only.p12"
          export ATMS_SIGNING_STORE_PASSWORD=DRY_RUN_NOT_A_SECRET
          export ATMS_SIGNING_KEY_ALIAS=atmspro
          export ATMS_SIGNING_KEY_PASSWORD=DRY_RUN_NOT_A_SECRET
          gradle --no-daemon --no-build-cache --no-configuration-cache :app:assembleDebug --dry-run > "$RUNNER_TEMP/v132-qa2-dryrun.log"
          for task in ':app:preBuild' ':app:ap01BrowserIntegration' ':app:ap01EditorSafety' ':app:qa2SigningSourceSafetyP11449' ':app:p11449ImageHeightRegression' ':app:verifyQa2SignedApkP11438'; do
            grep -Fq "$task " "$RUNNER_TEMP/v132-qa2-dryrun.log" || { echo "FAIL-CLOSED mandatory Gradle gate missing: $task"; exit 6; }
          done
          echo 'GRADLE_TASK_GRAPH_PASS (no APK build performed by dry-run)'

      - name: Recover existing protected signing key in temporary runner memory only
        shell: bash
        env:
          ATMS_SIGNING_KEYSTORE_B64: ${{ secrets.ATMS_SIGNING_KEYSTORE_B64 }}
          ATMS_SIGNING_PASSWORD: ${{ secrets.ATMS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ATMS_SIGNING_KEYSTORE_B64" && test -n "$ATMS_SIGNING_PASSWORD" || { echo 'FAIL-CLOSED protected signer missing'; exit 7; }
          umask 077
          printf '%s' "$ATMS_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/atms-v132-existing-signer.p12"
          test -s "$RUNNER_TEMP/atms-v132-existing-signer.p12" || { echo 'FAIL-CLOSED signer empty'; exit 8; }

      - name: Execute all original preBuild / browser / signing gates and ONE QA2 APK build
        shell: bash
        env:
          ATMS_SIGNING_STORE_FILE: ${{ runner.temp }}/atms-v132-existing-signer.p12
          ATMS_SIGNING_STORE_PASSWORD: ${{ secrets.ATMS_SIGNING_PASSWORD }}
          ATMS_SIGNING_KEY_ALIAS: atmspro
          ATMS_SIGNING_KEY_PASSWORD: ${{ secrets.ATMS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$ATMS_SIGNING_STORE_FILE" || { echo 'FAIL-CLOSED no persistent signer'; exit 9; }
          cd "$RUNNER_TEMP/atms-v132-qa2-isolated/android-native"
          # The original Gradle preBuild and post-build P11438 verifier remain UNMODIFIED.
          # Exactly one non-dry-run invocation; any failure blocks artifact publication.
          env -u GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN gradle --no-daemon --no-build-cache --no-configuration-cache :app:assembleDebug
          python3 - <<'PY_VERIFY_APK'
          import hashlib,json,os,pathlib,subprocess,re,shutil,zipfile
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          w=tmp/'atms-v132-qa2-isolated'/'android-native'
          apks=list(w.rglob('*.apk'))
          expected=w/'app/build/outputs/apk/debug/app-debug.apk'
          if len(apks)!=1 or apks[0].resolve()!=expected.resolve():
              raise SystemExit('FAIL-CLOSED exactly ONE QA2 APK required: '+str(apks))
          buildtools=pathlib.Path(os.environ['ANDROID_SDK_ROOT'])/'build-tools'
          signers=sorted(buildtools.glob('*/apksigner'))
          aapts=sorted(buildtools.glob('*/aapt'))
          if not signers or not aapts:raise SystemExit('FAIL-CLOSED Android signing/badging verification tools missing')
          signed=subprocess.run([str(signers[-1]),'verify','--verbose','--print-certs',str(expected)],capture_output=True,text=True,check=True).stdout
          if not re.search(r'Verified using v2 scheme.*:\s*true',signed):
              raise SystemExit('FAIL-CLOSED APK not APK-v2 verified')
          badging=subprocess.run([str(aapts[-1]),'dump','badging',str(expected)],capture_output=True,text=True,check=True).stdout
          if not re.search(r"package: name='de\.atmspro\.app\.qa2'",badging):
              raise SystemExit('FAIL-CLOSED package ID differs from TEST2')
          if "application-label:'ATMS PRO TEST 2'" not in badging:
              raise SystemExit('FAIL-CLOSED launcher label differs from TEST2')
          with zipfile.ZipFile(expected) as z:
              for asset in ['assets/js/plan-import.js','assets/js/atms-v132-source-preview.js','assets/index.html']:
                  target=w/'app/src/main'/asset
                  if asset not in z.namelist() or hashlib.sha256(z.read(asset)).digest()!=hashlib.sha256(target.read_bytes()).digest():
                      raise SystemExit('FAIL-CLOSED APK asset mismatch: '+asset)
          outfile=tmp/'ATMS_PRO_V132_STAGE1_TEST2_ONE_SIGNED.apk'
          if outfile.exists():raise SystemExit('FAIL-CLOSED refusing second APK output')
          shutil.copy2(expected,outfile)
          evidence=json.loads((tmp/'atms-v132-qa2-isolated'/'ATMS_V132_QA2_LOCAL_STAGING_EVIDENCE.json').read_text())
          evidence.update({'status':'SIGNED_TEST2_QA_APK_VERIFIED_NOT_SAMSUNG_TESTED',
                           'apk_sha256':hashlib.sha256(outfile.read_bytes()).hexdigest(),
                           'apk_name':outfile.name,'apk_count':1,'signed_v2':True,
                           'package':'de.atmspro.app.qa2','original_gradle_gates_unchanged':True,
                           'github_write_permission':False,'real_photo_ocr_passed':False})
          (tmp/'ATMS_PRO_V132_STAGE1_TEST2_VERIFICATION.json').write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          print('QA2 ONE SIGNED APK: verified, original-photo OCR NOT tested')
          PY_VERIFY_APK

      - name: Destroy temporary signing key even when build fails
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/atms-v132-existing-signer.p12"

      - name: Publish exactly one signed QA2 APK and non-personal verification report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ATMS-V132-STAGE1-TEST2-ONE-SIGNED-APK
          path: |
            ${{ runner.temp }}/ATMS_PRO_V132_STAGE1_TEST2_ONE_SIGNED.apk
            ${{ runner.temp }}/ATMS_PRO_V132_STAGE1_TEST2_VERIFICATION.json
          if-no-files-found: error
          retention-days: 7
