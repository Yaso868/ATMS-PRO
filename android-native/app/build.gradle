plugins {
    id 'com.android.application'
}

android {
    namespace 'de.atmspro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.atmspro.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.4.0-p31f14'
    }
    def stableKeystore = System.getenv('ATMS_SIGNING_STORE_FILE')
    def stableStorePassword = System.getenv('ATMS_SIGNING_STORE_PASSWORD')
    def stableKeyAlias = System.getenv('ATMS_SIGNING_KEY_ALIAS')
    def stableKeyPassword = System.getenv('ATMS_SIGNING_KEY_PASSWORD')
    def stableSigningAvailable = stableKeystore && stableStorePassword && stableKeyAlias && stableKeyPassword
    if (stableSigningAvailable) {
        signingConfigs {
            atmsStable {
                storeFile file(stableKeystore)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (stableSigningAvailable) {
                signingConfig signingConfigs.atmsStable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}


// P107.1: deterministic OCR-integrity gate. GitHub Actions assembleDebug must fail
// before packaging if a solved golden parser/integrity case regresses.
tasks.register('ocrIntegrityRegression', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/ocr-regression-selftest.js'
}


// P113.6: deterministic header/time integration gate. Executes the REAL
// imageWordsToMatrix() + mapping path in a browser-like VM with synthetic OCR
// geometry, including the missing Preis+ride-time and no-price control cases.
tasks.register('headerTimeIntegrationP1136', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/header-time-integration-selftest-p1136.js'
}

// P113.3.1: executable runtime gate. Syntax/source assertions alone did not catch
// the real-device block-scope ReferenceError in P113.3. This task executes the
// real recoverTextIntegrityTargeted() body and a complete analyze() control path
// before any APK may be packaged.
tasks.register('planImportRuntimeSmoke', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/plan-import-runtime-smoke-p11331.js'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('ocrIntegrityRegression')
    dependsOn tasks.named('planImportRuntimeSmoke')
    dependsOn tasks.named('headerTimeIntegrationP1136')
}
