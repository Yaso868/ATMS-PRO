plugins {
    id 'com.android.application'
}

android {
    namespace 'de.atmspro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.atmspro.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.4.0-p31f14'
    }
    def stableKeystore = System.getenv('ATMS_SIGNING_STORE_FILE')
    def stableStorePassword = System.getenv('ATMS_SIGNING_STORE_PASSWORD')
    def stableKeyAlias = System.getenv('ATMS_SIGNING_KEY_ALIAS')
    def stableKeyPassword = System.getenv('ATMS_SIGNING_KEY_PASSWORD')
    def stableSigningAvailable = stableKeystore && stableStorePassword && stableKeyAlias && stableKeyPassword
    if (stableSigningAvailable) {
        signingConfigs {
            atmsStable {
                storeFile file(stableKeystore)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (stableSigningAvailable) {
                signingConfig signingConfigs.atmsStable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}


// P107.1: deterministic OCR-integrity gate. GitHub Actions assembleDebug must fail
// before packaging if a solved golden parser/integrity case regresses.
tasks.register('ocrIntegrityRegression', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/ocr-regression-selftest.js'
}


// P113.6: deterministic header/time integration gate. Executes the REAL
// imageWordsToMatrix() + mapping path in a browser-like VM with synthetic OCR
// geometry, including the missing Preis+ride-time and no-price control cases.
tasks.register('headerTimeIntegrationP1136', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/header-time-integration-selftest-p1136.js'
}


// P113.7: deterministic mirror-schema / degraded-header integration gate.
// Executes the REAL imageWordsToMatrix() + mapping path and the bounded
// company/route/cancellation evidence helpers. It includes positive recovery
// and fail-closed negative controls before any APK may be packaged.
tasks.register('mirrorSchemaIntegrityP1137', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/mirror-schema-integrity-selftest-p1137.js'
}


// P113.8: bounded text-edge integrity gate. Exercises the real helper logic for
// primary-vs-secondary terminal punctuation, hyphenated short-code edge loss,
// strong raw route preservation, and single-token flight-location edge recovery.
tasks.register('textEdgeIntegrityP1138', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/text-edge-integrity-selftest-p1138.js'
}

// P113.9: source-truth full-cell edge-integrity gate. Two independent full-cell
// modes must agree before a bounded 1-2 glyph edge extension can preserve/recover
// a value; semantic substitutions and one-view evidence remain fail-closed.
tasks.register('textEdgeSourceTruthP1139', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/text-edge-source-truth-selftest-p1139.js'
}

// P114.0: bounded edge-expanded source-truth gate. It proves that company
// primary preservation no longer depends on an unrelated plan peer when two
// full-cell source views agree, while flight-location recovery requires two
// agreeing bounded edge-expanded views and strict 1-2 glyph edge extension.
tasks.register('edgeSourceTruthP1140', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/edge-source-truth-selftest-p1140.js'
}


// P114.1: primary source-truth veto gate. Two agreeing source-truth cell views
// may suppress only proven secondary edge truncation/table-rule noise; semantic
// alternatives, one-view evidence and disagreeing views remain fail-closed.
tasks.register('edgePrimaryVetoP1141', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/edge-primary-veto-selftest-p1141.js'
}

// P114.2: company boundary source-truth veto. Two agreeing bounded source-truth
// views may suppress only isolated table-rule glyph noise or exactly one missing
// internal company delimiter; semantic substitutions remain fail-closed.
tasks.register('companyBoundaryVetoP1142', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-boundary-veto-selftest-p1142.js'
}

// P114.3: real-state company source-truth gate. Full-cell candidates are
// field-normalized before consensus, and one internal delimiter loss may be
// suppressed only with strong primary OCR plus repeated same-plan peers.
tasks.register('companyBoundaryRealstateP1143', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-boundary-realstate-selftest-p1143.js'
}

// P114.4: runtime asset-generation alignment gate. The visible core, index script
// queries, PWA bootstrap registration, service-worker cache/shell and offline
// fallback must all use P1144 before packaging. OCR/import semantics stay P1143.
tasks.register('runtimeAssetAlignmentP1144', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/runtime-asset-alignment-selftest-p1144.js'
}


// P114.5: deterministic company-boundary classification gate. Extreme table-rule
// glyphs may be ignored only around a bounded repeated hyphenated short code;
// one internal delimiter loss may reuse only recorded >=3-vote plan consensus.
tasks.register('companyBoundaryDeterministicP1145', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-boundary-deterministic-selftest-p1145.js'
}

// P114.5: runtime generation alignment gate for the new company-boundary semantics.
tasks.register('runtimeAssetAlignmentP1145', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/runtime-asset-alignment-selftest-p1145.js'
}

// P114.6: post-consensus stale company-conflict reconciliation. The real pipeline
// order is executed: text conflict state -> repeated-text consistency -> narrow
// reconciliation -> zero-silent-error gate. Semantic alternatives remain fail-closed.
tasks.register('companyConflictPostConsensusP1146', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-conflict-post-consensus-selftest-p1146.js'
}

// P114.6: runtime generation alignment gate for the reconciled pipeline semantics.
tasks.register('runtimeAssetAlignmentP1146', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/runtime-asset-alignment-selftest-p1146.js'
}

// P113.3.1: executable runtime gate. Syntax/source assertions alone did not catch
// the real-device block-scope ReferenceError in P113.3. This task executes the
// real recoverTextIntegrityTargeted() body and a complete analyze() control path
// before any APK may be packaged.
tasks.register('planImportRuntimeSmoke', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/plan-import-runtime-smoke-p11331.js'
}

// P114.7: execute production pipeline, fail-closed regressions and checked-in
// master prompt as mandatory preBuild tests before the CI accepts an APK.
tasks.register('companyPrimaryAlreadyCorrectP1147', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-primary-already-correct-selftest-p1147.js'
}
tasks.register('runtimeAssetAlignmentP1147', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/runtime-asset-alignment-selftest-p1147.js'
}
tasks.register('masterPromptRuleGateP1147', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/master-prompt-rule-gate-p1147.js'
}

// P114.8: original-image-cell provenance must survive the independent text review.
// Real production factory -> conflict -> repeated-text -> reconcile -> import gate;
// negative competing cell views and semantic alternatives remain fail closed.
tasks.register('companyPrimaryProvenanceP1148', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-primary-provenance-selftest-p1148.js'
}

// P114.8: only this generation's asset alignment gate is version-bound.
tasks.register('runtimeAssetAlignmentP1148', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/runtime-asset-alignment-selftest-p1148.js'
}

// P114.9: bounded source-tail OCR for incomplete printed company cells.
// Positive & fail-closed real production decision tests; safety rejects neighbor
// spill, conflicting independent views, malformed provenance and semantic edits.
tasks.register('companyAdaptiveTailP1149', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/company-adaptive-tail-selftest-p1149.js'
}
// Only current version-specific cache/asset generation may gate preBuild.
tasks.register('runtimeAssetAlignmentP1149', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/runtime-asset-alignment-selftest-p1149.js'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('ocrIntegrityRegression')
    dependsOn tasks.named('planImportRuntimeSmoke')
    dependsOn tasks.named('headerTimeIntegrationP1136')
    dependsOn tasks.named('mirrorSchemaIntegrityP1137')
    dependsOn tasks.named('textEdgeIntegrityP1138')
    dependsOn tasks.named('textEdgeSourceTruthP1139')
    dependsOn tasks.named('edgeSourceTruthP1140')
    dependsOn tasks.named('edgePrimaryVetoP1141')
    dependsOn tasks.named('companyBoundaryVetoP1142')
    dependsOn tasks.named('companyBoundaryRealstateP1143')
    dependsOn tasks.named('companyBoundaryDeterministicP1145')
    dependsOn tasks.named('companyConflictPostConsensusP1146')
    // Version-specific runtime alignment: only the currently active P114.9 gate may block preBuild.
    // Keep the P114.6 functional conflict regression above; it is not a version marker gate.
    dependsOn tasks.named('companyPrimaryAlreadyCorrectP1147')
    dependsOn tasks.named('runtimeAssetAlignmentP1149')
    dependsOn tasks.named('companyAdaptiveTailP1149')
    dependsOn tasks.named('companyPrimaryProvenanceP1148')
    dependsOn tasks.named('masterPromptRuleGateP1147')
}
