plugins {
    id 'com.android.application'
}

android {
    namespace 'de.atmspro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.atmspro.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.4.0-p31f13'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
